[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-hybrid-ir"
version = "0.1.0"
description = "A small local hybrid information retrieval CLI for teaching and practical search."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.6"]
dev = ["pytest>=7"]

[project.scripts]
local-hybrid-ir = "local_hybrid_ir.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_hybrid_ir*"]
